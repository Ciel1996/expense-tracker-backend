[package]
name = "expense_tracker"
version = "1.3.4"
edition = "2024"
description = "A REST Api that offers various endpoints for handling shared expenses."
license = "GPL-3.0-or-later"
authors = ["Ciel1996"]

[dependencies]
expense_tracker_api = { path = "../../libs/expense_tracker_api" }
expense_tracker_db = { path = "../../libs/expense_tracker_db" }
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["full"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
utoipa = "6.0.0"
utoipa-axum = "0.3"
tower = "0.5.3"
tower-http = {version = "0.7.1", features = ["trace", "cors"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", features = ["json"] }
log = "0.4.34"
tracing-subscriber = { version = "0.3.23", features=["env-filter"] }
config = { version = "0.15.27", features = ["toml"] }
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.7", features = [ "derive" ] }
http = "1.5.0"

[package]
name = "expense_tracker_api"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Ciel1996"]

[dependencies]
expense_tracker_db = { path = "../expense_tracker_db" }
expense_tracker_services = { path = "../expense_tracker_services" }
axum = "0.8.9"
utoipa = { version = "6.0.0", features = ["uuid", "chrono"] }
utoipa-axum = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
hyper = { version = "1.12.0", features = ["full"] }
uuid = "1.28.0"
log = "0.4.34"
chrono = { version = "0.4.45", features = ["serde"] }
